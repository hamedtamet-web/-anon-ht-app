<script>
'use strict';

const ModerationManager = (() => {
    const BAD_WORDS = {
        ar: ["كلمة_سيئة_1","كلمة_سيئة_2"],
        en: ["badword1","badword2"],
        fr: ["motinterdit1","motinterdit2"]
    };
    const forbiddenSet = new Set(
        Object.values(BAD_WORDS).flat().filter(w => w && w.trim()).map(w => w.trim().toLowerCase())
    );
    const patterns = [...forbiddenSet].map(word => ({
        word,
        regex: new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi')
    }));
    function cleanContent(text) {
        if (!text) return text;
        let result = text;
        for (const {regex} of patterns) result = result.replace(regex, '****');
        return result;
    }
    function containsBadWords(text) {
        if (!text) return false;
        const lower = text.toLowerCase();
        for (const word of forbiddenSet) { if (lower.includes(word)) return true; }
        return false;
    }
    return { cleanContent, containsBadWords };
})();

};

});

const _escEl = document.createElement('div');
function escapeHtml(s) {
    _escEl.textContent = String(s ?? '');
    return _escEl.innerHTML;
}

function safeImgSrc(url, fallback='images/user.png') {
    if (!url) return fallback;
    try {
        const u = new URL(url);
        return u.protocol === 'https:' ? url : fallback;
    } catch { return fallback; }
}

function sanitizeId(id) {
    return (id || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 128);
}

const _fmt = {};
function getFormatter(lang, opts) {
    const key = lang + JSON.stringify(opts);
    if (!_fmt[key]) _fmt[key] = new Intl.DateTimeFormat(lang === 'ar' ? 'ar-EG' : 'en-GB', opts);
    return _fmt[key];
}

const formatDate = ts => {
    if (!ts) return '';
    return getFormatter(currentLang, {year:'numeric',month:'short',day:'numeric'}).format(new Date(ts.seconds * 1000));
};
const formatTime = ts => {
    if (!ts) return '';
    return getFormatter(currentLang, {hour:'2-digit',minute:'2-digit'}).format(new Date(ts.seconds * 1000));
};

function timeAgo(ts) {
    if (!ts) return '';
    const m = Math.floor((Date.now() - ts.seconds * 1000) / 60000);
    if (m < 1)  return currentLang === 'ar' ? 'الآن' : 'Now';
    if (m < 60) return currentLang === 'ar' ? m+'د'  : m+'m';
    const h = Math.floor(m / 60);
    if (h < 24) return currentLang === 'ar' ? h+'س'  : h+'h';
    return currentLang === 'ar' ? Math.floor(h/24)+'ي' : Math.floor(h/24)+'d';
}

const ALLOWED_TYPES = new Set(['image/jpeg','image/jpg','image/png','image/webp']);

function validateImageFile(f) {
    if (!ALLOWED_TYPES.has(f.type)) { toast('error', t('upload_error_type')); return false; }
    if (f.size > 5 * 1024 * 1024)  { toast('error', t('upload_error_size')); return false; }
    return true;
}

async function uploadToCloudinary(file, type) {
    if (!auth.currentUser || auth.currentUser.uid !== currentProfileId) return;
    if (!validateImageFile(file)) return;

    const uid       = auth.currentUser.uid;
    const cloudName = APP_CONFIG.cloudinary.cloudName;
    const preset    = APP_CONFIG.cloudinary.uploadPreset;
    const publicId  = type === 'avatar' ? `anon_users/${uid}/avatar` : `anon_users/${uid}/cover`;

    Swal.fire({...swalBase, title:'⏳ '+t('uploading'), allowOutsideClick:false, showConfirmButton:false,
        didOpen:()=>Swal.showLoading()});

    try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', preset);
        formData.append('public_id', publicId);

        const res = await fetch(
            `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`,
            {method:'POST', body:formData}
        );
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error?.message || 'Cloudinary error');
        }

        const data     = await res.json();
        const freshUrl = `${data.secure_url}?v=${data.version || Date.now()}`;
        const updateObj = {[type === 'avatar' ? 'avatarUrl' : 'coverUrl']: data.secure_url};

        if (type === 'avatar') {
            document.getElementById('avatarImg').src = freshUrl;
        } else {
            const c = document.getElementById('coverImg');
            c.src = freshUrl;
            c.style.display = 'block';
        }

        await db.collection('users').doc(uid).update(updateObj);
        Swal.close();
        toast('success', t('upload_success'));
    } catch(e) {
        console.error('Upload error:', e);
        Swal.fire({
            ...swalBase, icon:'error', iconColor:'#f80566',
            title:'❌ '+t('upload_fail'), text:e.message, confirmButtonText:t('ok_btn')
        });
    }
}

function updateSEO(name, bio, avatarUrl, username) {
    const pageUrl = `${location.origin}${location.pathname}?id=${currentProfileId}`;
    const desc    = bio
        ? `${name} على Anon — ${bio.slice(0,120)}`
        : `تصفّح ملف ${name} على منصة Anon وأرسل سؤالاً مجهولاً.`;
    const img  = avatarUrl || 'images/logo.png';
    const full = `${name} (@${username}) | Anon`;

    document.title = full;
    document.getElementById('seoTitle').textContent    = full;
    document.getElementById('seoDesc').content         = desc;
    document.getElementById('seoCanonical').href       = pageUrl;
    ['ogTitle','twTitle'].forEach(id  => document.getElementById(id).content = full);
    ['ogDesc','twDesc'].forEach(id    => document.getElementById(id).content = desc);
    ['ogImage','twImage'].forEach(id  => document.getElementById(id).content = img);
    document.getElementById('ogUrl').content           = pageUrl;

    document.getElementById('schemaScript').textContent = JSON.stringify({
        "@context":"https://schema.org","@type":"ProfilePage",
        "name":`${name} | Anon`,"url":pageUrl,"description":desc,
        "mainEntity":{"@type":"Person","name":name,"alternateName":`@${username}`,"image":img,"description":bio||''},
        "publisher":{"@type":"Organization","name":"Anon","logo":{"@type":"ImageObject","url":`${location.origin}/images/logo.png`}}
    });
}

async function sendQuestion() {
    if (!auth.currentUser || isOwner) return;
    if (isBlocked || iBlockedByThem) return;

    const now = Date.now();
    if (now - lastQuestionSentAt < RATE_LIMIT_MS) return toast('warning', t('rate_limit'));

    const rawText = document.getElementById('qInput').value.trim();
    if (!rawText)             return toast('warning', t('question_empty'));
    if (rawText.length > 500) return toast('warning', t('question_too_long'));

    const cleanedText  = ModerationManager.cleanContent(rawText);
    lastQuestionSentAt = now;

    const freshDoc  = await db.collection('users').doc(auth.currentUser.uid).get();
    const freshData = freshDoc.data() || {};

    const senderName     = isPublicMode ? (freshData.name     || t('anonymous')) : null;
    const senderUsername = isPublicMode ? (freshData.username || '')             : null;
    const senderAvatar   = isPublicMode ? (freshData.avatarUrl || auth.currentUser?.photoURL || '') : null;
    const senderId = auth.currentUser.uid;

    try {
        await db.collection('questions').add({
            receiverId:     currentProfileId,
            senderId,
            senderName,
            senderUsername,
            senderAvatar,
            isAnonymous:    !isPublicMode,
            text:           cleanedText,
            status:         'pending',
            answer:         '',
            likesCount:     0,
            likedBy:        [],
            createdAt:      firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('qInput').value = '';
        document.getElementById('qFilterWarn')?.classList.remove('show');
        toast('success', t('question_sent'));
    } catch(e) {
        console.error(e);
        lastQuestionSentAt = 0;
        toast('error', t('send_error'));
    }
}

async function initPushNotifications(uid) {
    try {
        if (!('Notification' in window)) return;
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        const messaging = firebase.messaging();
        const token = await messaging.getToken({
            vapidKey: APP_CONFIG.fcm.vapidKey,
            serviceWorkerRegistration: await navigator.serviceWorker.ready
        });

        if (token) {
            await db.collection('users').doc(uid).update({
                fcmTokens: firebase.firestore.FieldValue.arrayUnion(token)
            });
        }

        messaging.onMessage((payload) => {
            const type = payload.data?.type;
            if (type === 'question') {
                document.getElementById('sndQuestion')?.play().catch(() => {});
            } else {
                document.getElementById('sndNotif')?.play().catch(() => {});
            }
        });
    } catch(e) {
        console.log('Push error:', e);
    }
}

auth.onAuthStateChanged(async user => {
    if (!user) return (location.href = 'signin.html');

    const meDoc = await db.collection('users').doc(user.uid).get();
    currentUserData = meDoc.data() || {};
    if (!currentUserData.avatarUrl && auth.currentUser?.photoURL) {
        currentUserData.avatarUrl = auth.currentUser.photoURL;
    }

    document.getElementById('userCoins').textContent = (currentUserData.anonCoins || 0).toFixed(2);
    db.collection('users').doc(user.uid).onSnapshot(snap => {
        const d = snap.data();
        if (d) document.getElementById('userCoins').textContent = (d.anonCoins || 0).toFixed(2);
    });

    const params = new URLSearchParams(location.search);
    const rawId  = params.get('id');

    currentProfileId = rawId ? sanitizeId(rawId) : user.uid;
    if (!currentProfileId) return (location.href = 'signin.html');

    isOwner = (currentProfileId === user.uid);

    if (!isOwner) {
        await checkMutualBlock(user.uid, currentProfileId);
    }

    loadProfileData(currentProfileId, isOwner);

    if (isOwner) {
        document.getElementById('accountTabBtn').style.display = 'block';
        document.getElementById('shoutTabBtn').style.display   = 'none';
        document.getElementById('avatarBox').classList.add('is-owner');
        document.getElementById('coverWrapper').classList.add('is-owner');
        document.getElementById('avatarBox').addEventListener('click', () => document.getElementById('avatarInput').click());
        document.getElementById('coverWrapper').addEventListener('click', () => document.getElementById('coverInput').click());
        document.getElementById('interactionBar').classList.remove('visible');
        document.getElementById('ownerShoutBox').style.display = 'block';
        document.getElementById('visitorAskBox').style.display = 'none';
        toggleShoutMode();
    } else {
        document.getElementById('interactionBar').classList.add('visible');
        document.getElementById('visitorAskBox').style.display = (isBlocked || iBlockedByThem) ? 'none' : 'block';
        document.getElementById('ownerShoutBox').style.display = 'none';
        checkFollowStatus();
        checkBlockStatus(currentProfileId);
    }

    listenToPendingQuestions(user.uid);
    initPushNotifications(user.uid);
    currentLang = LangManager.get();
    updateLanguage(currentLang);
});

async function checkMutualBlock(myUid, profileId) {
    try {
        const [myBlockDoc, theirBlockDoc] = await Promise.all([
            db.collection('users').doc(myUid).collection('blocked').doc(profileId).get(),
            db.collection('users').doc(profileId).collection('blocked').doc(myUid).get()
        ]);
        isBlocked      = myBlockDoc.exists;
        iBlockedByThem = theirBlockDoc.exists;
        if (isBlocked || iBlockedByThem) showBlockedScreen();
    } catch(e) {
        console.error('checkMutualBlock error:', e);
    }
}

function listenToPendingQuestions(uid) {
    if (questionsListener) { questionsListener(); questionsListener = null; }
    initialQuestionsLoaded = false;
    questionsListener = db.collection('questions')
        .where('receiverId', '==', uid)
        .where('status', '==', 'pending')
        .onSnapshot(snap => {
            const badge = document.getElementById('qBadgeNav');
            if (!snap.empty) {
                badge.style.display = 'flex';
                badge.textContent   = snap.size;
                if (initialQuestionsLoaded) {
                    snap.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            document.getElementById('sndQuestion')?.play().catch(()=>{});
                        }
                    });
                }
            } else {
                badge.style.display = 'none';
            }
            initialQuestionsLoaded = true;
        });
}

async function sendFollowNotification(followerUid, profileOwnerUid) {
    try {
        const followerDoc  = await db.collection('users').doc(followerUid).get();
        const followerData = followerDoc.data() || {};
        await db.collection('notifications').add({
            receiverId:       profileOwnerUid,
            senderId:         followerUid,
            senderName:       followerData.name      || t('anonymous'),
            senderUsername:   followerData.username  || '',
            senderAvatar:     followerData.avatarUrl || '',
            isSenderVerified: !!(followerData.isVerified || followerData.isPremium),
            type:             'follow',
            contentId:        followerUid,
            isRead:           false,
            timestamp:        firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch(e) { console.error('sendFollowNotification:', e); }
}

function updateLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-key]').forEach(el => {
        const v = translations[lang]?.[el.dataset.key];
        if (v) el.textContent = v;
    });
    document.querySelectorAll('[data-placeholder]').forEach(el => {
        const v = translations[lang]?.[el.dataset.placeholder];
        if (v) el.placeholder = v;
    });

    const bb = document.getElementById('blockBtnText');
    if (bb) bb.textContent = isBlocked ? t('unblock_btn') : t('block_btn');

    const followSpan = document.getElementById('followBtnText');
    if (followSpan) followSpan.textContent = isFollowing ? t('following_btn') : t('follow_btn');

    if (!isOwner) toggleQuestionMode();
    else toggleShoutMode();

    if (isBlocked || iBlockedByThem) {
        const el = document.getElementById('blockedMsg');
        if (el) el.innerHTML = t('blocked_msg');
    }
}

function copyProfileLink() {
    const uname = currentUserData?.username || '';
    const url   = uname
        ? `${location.origin}/${uname}`
        : `${location.origin}/profile.html?id=${currentProfileId}`;

    (navigator.clipboard
        ? navigator.clipboard.writeText(url)
        : Promise.resolve().then(() => {
            const el = document.createElement('textarea');
            el.value = url; document.body.appendChild(el);
            el.select(); document.execCommand('copy');
            document.body.removeChild(el);
        })
    ).then(() => toast('success', t('copy_success')));

    document.getElementById('profileActionsMenu').style.display = 'none';
}

function checkFollowStatus() {
    if (!auth.currentUser) return;
    if (followListener) { followListener(); followListener = null; }

    followListener = db.collection('users').doc(currentProfileId)
        .collection('followers').doc(auth.currentUser.uid)
        .onSnapshot(doc => {
            isFollowing = doc.exists;
            const btnF  = document.getElementById('btnFollow');
            const btnN  = document.getElementById('btnNotify');
            if (btnF) {
                const span = document.getElementById('followBtnText');
                if (span) span.textContent = isFollowing ? t('following_btn') : t('follow_btn');
                btnF.className = isFollowing ? 'follow-btn followed' : 'follow-btn unfollowed';
            }
            if (btnN) {
                btnN.classList.toggle('show', isFollowing);
                btnN.classList.toggle('active', isFollowing && !!(doc.data()?.notifications));
            }
        });
}

async function toggleFollow() {
    if (!auth.currentUser || isOwner) return;
    if (isBlocked || iBlockedByThem) return;
    const uid = auth.currentUser.uid;
    const ref = db.collection('users').doc(currentProfileId).collection('followers').doc(uid);
    if (isFollowing) {
        await ref.delete();
        await db.collection('users').doc(currentProfileId).update({
            followersCount: firebase.firestore.FieldValue.increment(-1)
        });
    } else {
        await ref.set({followedAt:firebase.firestore.FieldValue.serverTimestamp(), notifications:false});
        await db.collection('users').doc(currentProfileId).update({
            followersCount: firebase.firestore.FieldValue.increment(1)
        });
        await sendFollowNotification(uid, currentProfileId);
        notifyNewFollow(currentProfileId, currentUserData?.name || 'أحدهم');
    }
}

async function toggleNotify() {
    if (!auth.currentUser || isOwner || !isFollowing) return;
    const ref = db.collection('users').doc(currentProfileId)
        .collection('followers').doc(auth.currentUser.uid);
    const doc = await ref.get();
    await ref.update({notifications:!(doc.exists && doc.data().notifications)});
}

function checkBlockStatus(profileId) {
    if (!auth.currentUser) return;
    if (blockListener) { blockListener(); blockListener = null; }

    blockListener = db.collection('users').doc(auth.currentUser.uid)
        .collection('blocked').doc(profileId)
        .onSnapshot(async doc => {
            isBlocked = doc.exists;
            const bt = document.getElementById('blockBtnText');
            const bi = document.getElementById('blockBtnIcon');
            if (bt) bt.textContent = isBlocked ? t('unblock_btn') : t('block_btn');
            if (bi) bi.className  = isBlocked ? 'fa-solid fa-check' : 'fa-solid fa-ban';

            if (auth.currentUser) {
                const theirBlock = await db.collection('users').doc(profileId)
                    .collection('blocked').doc(auth.currentUser.uid).get();
                iBlockedByThem = theirBlock.exists;
            }

            if (isBlocked || iBlockedByThem) {
                showBlockedScreen();
            } else {
                hideBlockedScreen();
                document.getElementById('visitorAskBox').style.display = 'block';
            }
        });
}

async function toggleBlockProfile() {
    if (!auth.currentUser) return;
    const ref = db.collection('users').doc(auth.currentUser.uid)
        .collection('blocked').doc(currentProfileId);
    if (isBlocked) {
        await ref.delete();
    } else {
        await ref.set({blockedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    document.getElementById('profileActionsMenu').style.display = 'none';
}

async function reportProfile() {
    if (!auth.currentUser) return;
    const {value:reason} = await Swal.fire({
        ...swalBase,
        title:t('report_title'), input:'textarea',
        inputPlaceholder:t('report_placeholder'),
        showCancelButton:true,
        confirmButtonText:t('report_send'), cancelButtonText:t('cancel_btn'),
    });
    if (!reason || !reason.trim()) return;
    await db.collection('reports').add({
        reportedUser: currentProfileId,
        reportedBy:   auth.currentUser.uid,
        reason:       reason.trim().slice(0,500),
        createdAt:    firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('success', t('report_success'));
    document.getElementById('profileActionsMenu').style.display = 'none';

async function saveData() {
    if (!auth.currentUser || !isOwner) return;

        const mu = document.getElementById('mainUserBadge');
        ma.style.display = mu.style.display = 'none';

async function loadAnswers(uid) {
    const tab = document.getElementById('tab-latest');
    tab.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';

    try {
        const ownerSnap = await db.collection('users').doc(uid).get();
        const ownerData = ownerSnap.exists ? ownerSnap.data() : {};

        const snap = await db.collection('answers')
            .where('userId','==',uid)
            .orderBy('answeredAt','desc')
            .get();

        tab.innerHTML = '';
        if (snap.empty) {
            tab.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comment-dots" aria-hidden="true"></i><p>${escapeHtml(t('no_answers'))}</p></div>`;
            document.getElementById('count-answers').textContent = 0;
            document.getElementById('count-likes').textContent = 0;
            return;
        }

        let totalLikes = 0;
        const frag = document.createDocumentFragment();
        let cnt = 0;

        snap.forEach(d => {
            cnt++;
            const data = d.data();
            totalLikes += data.likesCount ?? (Array.isArray(data.likedBy) ? data.likedBy.length : 0);
            frag.appendChild(buildAnswerCard(d.id, data, ownerData));
        });

        tab.appendChild(frag);
        document.getElementById('count-answers').textContent = cnt.toLocaleString();
        document.getElementById('count-likes').textContent = totalLikes.toLocaleString();

        if (typeof AdsManager !== 'undefined') AdsManager.injectAds(tab);
    } catch(e) {
        console.error('loadAnswers:', e);
        tab.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><p>${escapeHtml(t('generic_error'))}</p></div>`;
    }
}

async function loadFeaturedAnswers(uid) {
    const tab = document.getElementById('tab-featured');
    if (tab.dataset.loaded) return;
    tab.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';

    try {
        const ownerSnap = await db.collection('users').doc(uid).get();
        const ownerData = ownerSnap.exists ? ownerSnap.data() : {};

        const snap = await db.collection('answers')
            .where('userId','==',uid)
            .limit(100)
            .get();

        tab.innerHTML = '';
        if (snap.empty) {
            tab.innerHTML = `<div class="empty-state"><i class="fa-regular fa-star" aria-hidden="true"></i><p>${escapeHtml(t('no_answers'))}</p></div>`;
            return;
        }

        const docs = [];
        snap.forEach(d => docs.push({id:d.id, data:d.data()}));

        docs.sort((a,b) =>
            (b.data.likesCount ?? b.data.likedBy?.length ?? 0) -
            (a.data.likesCount ?? a.data.likedBy?.length ?? 0)
        );

        const frag = document.createDocumentFragment();
        docs.slice(0,20).forEach(d => frag.appendChild(buildAnswerCard(d.id, d.data, ownerData)));
        tab.appendChild(frag);
        tab.dataset.loaded = '1';
    } catch(e) { console.error('loadFeaturedAnswers:', e); }
}

function buildAnswerCard(id, data, ownerData) {
    const likedByArr  = Array.isArray(data.likedBy) ? data.likedBy : [];
    const liked       = !!(auth.currentUser && likedByArr.includes(auth.currentUser.uid));
    const likesCount  = data.likesCount ?? likedByArr.length;

    const username        = (ownerData.username || '').toLowerCase();
    const isDev           = username === 'ht';
    const isVerified      = !!(ownerData.isPremium || ownerData.isVerified);
    const cardGlowClass   = isDev ? 'dev-glow' : (isVerified ? 'user-glow' : '');
    const avatarGlowClass = isDev ? 'admin-glow' : (isVerified ? 'verify-glow' : '');

    const div = document.createElement('div');
    div.className = `ans-card ${cardGlowClass}`;
    div.dataset.answerId = id;

    const header = document.createElement('div'); header.className = 'ans-header';

    const avatarFrame = document.createElement('div');
    avatarFrame.className = `avatar-frame ${avatarGlowClass}`;
    avatarFrame.setAttribute('role','button');
    avatarFrame.setAttribute('tabindex','0');
    avatarFrame.onclick = () => location.href = `profile.html?id=${currentProfileId}`;
    const avImg = document.createElement('img');
    avImg.src     = safeImgSrc(ownerData.avatarUrl);
    avImg.alt     = ownerData.name || 'صورة المستخدم';
    avImg.loading = 'lazy';
    avImg.onerror = () => { avImg.src = 'images/user.png'; };
    avatarFrame.appendChild(avImg);

    const userInfoText = document.createElement('div');
    userInfoText.className = 'user-info-text';
    userInfoText.onclick   = () => location.href = `profile.html?id=${currentProfileId}`;

    const nameRow = document.createElement('div');
    nameRow.style.cssText = 'display:flex;align-items:center;gap:5px;flex-wrap:wrap;';
    const displayNameSpan = document.createElement('span');
    displayNameSpan.className   = 'ans-display-name';
    displayNameSpan.textContent = ownerData.name || t('anonymous');
    nameRow.appendChild(displayNameSpan);

    if (isDev) {
        const adminBadge = document.createElement('img');
        adminBadge.src='images/admin-verified-logo.png'; adminBadge.style.height='14px'; adminBadge.alt='شارة المطور';
        nameRow.appendChild(adminBadge);
        const devLabel = document.createElement('span');
        devLabel.style.cssText='font-size:9px;background:var(--admin-red);padding:1px 5px;border-radius:4px;';
        devLabel.innerHTML='<i class="fa-solid fa-code" aria-hidden="true"></i> المطور';
        nameRow.appendChild(devLabel);
    } else if (isVerified) {
        const verBadge = document.createElement('img');
        verBadge.src='images/verified-logo.png'; verBadge.style.height='14px'; verBadge.alt='موثق';
        nameRow.appendChild(verBadge);
    }

    const userNameSub = document.createElement('span');
    userNameSub.className   = 'ans-user-name-sub';
    userNameSub.textContent = username ? `@${username}` : '';
    userInfoText.appendChild(nameRow);
    userInfoText.appendChild(userNameSub);
    header.appendChild(avatarFrame);
    header.appendChild(userInfoText);

    const headerActions = document.createElement('div');
    headerActions.style.cssText = 'display:flex;align-items:center;gap:12px;';
    if (isOwner) {
        const delBtn = document.createElement('button');
        delBtn.setAttribute('aria-label','حذف الإجابة');
        delBtn.style.cssText='background:none;border:none;color:#333;font-size:13px;cursor:pointer;transition:color 0.2s;padding:4px;';
        delBtn.innerHTML='<i class="fa-solid fa-trash-can" aria-hidden="true"></i>';
        delBtn.onmouseenter = () => delBtn.style.color='#ff4b4b';
        delBtn.onmouseleave = () => delBtn.style.color='#333';
        delBtn.onclick = () => deleteAnswer(id, data.questionId);
        headerActions.appendChild(delBtn);
    }
    header.appendChild(headerActions);

    const qDiv = document.createElement('div'); qDiv.className = 'ans-q';
    qDiv.textContent = data.questionText || '';

    const aDiv = document.createElement('div'); aDiv.className = 'ans-a';
    aDiv.textContent = data.reply || '';

    const footer  = document.createElement('div'); footer.className  = 'ans-footer';
    const actions = document.createElement('div'); actions.className = 'ans-actions';

    const likeBtn = document.createElement('button');
    likeBtn.className = 'action-btn'+(liked?' liked':'');
    likeBtn.setAttribute('aria-label', 'إعجاب');
    likeBtn.onclick = () => toggleLike(id, likeBtn, data.userId||currentProfileId);
    const likeIcon  = document.createElement('i');
    likeIcon.className = liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
    likeIcon.setAttribute('aria-hidden','true');
    const likeCount = document.createElement('span');
    likeCount.textContent = likesCount;
    likeBtn.appendChild(likeIcon);
    likeBtn.appendChild(likeCount);
    actions.appendChild(likeBtn);

    const replyBtn = document.createElement('button');
    replyBtn.className = 'action-btn';
    replyBtn.setAttribute('aria-label','الردود');
    replyBtn.innerHTML='<i class="fa-regular fa-comment" aria-hidden="true"></i> <span>الردود</span>';
    replyBtn.onclick = () => location.href = `thread.html?id=${id}`;
    actions.appendChild(replyBtn);

    const timeTs = data.answeredAt;
    const timeContainer = document.createElement('div'); timeContainer.className='ans-time-container';
    const timeSpan = document.createElement('span'); timeSpan.className='ans-time'; timeSpan.textContent=formatTime(timeTs);
    const dateSpan = document.createElement('span'); dateSpan.className='ans-date-sub'; dateSpan.textContent=formatDate(timeTs);
    timeContainer.appendChild(timeSpan);
    timeContainer.appendChild(dateSpan);

    footer.appendChild(actions);
    footer.appendChild(timeContainer);
    div.appendChild(header);
    div.appendChild(qDiv);
    div.appendChild(aDiv);
    div.appendChild(footer);
    return div;
}

async function toggleLike(id, btn, ownerId) {
    if (!auth.currentUser) return;
    const uid = auth.currentUser.uid;

    const isLiked      = btn.classList.contains('liked');
    const countSpan    = btn.querySelector('span');
    const iconEl       = btn.querySelector('i');
    const currentCount = parseInt(countSpan?.textContent || '0');

    if (isLiked) {
        btn.classList.remove('liked');
        if (iconEl) iconEl.className = 'fa-regular fa-heart';
        if (countSpan) countSpan.textContent = Math.max(0, currentCount - 1);
    } else {
        btn.classList.add('liked');
        if (iconEl) iconEl.className = 'fa-solid fa-heart';
        if (countSpan) countSpan.textContent = currentCount + 1;
    }

    try {
        const ref = db.collection('answers').doc(id);
        if (isLiked) {
            await ref.update({
                likedBy:    firebase.firestore.FieldValue.arrayRemove(uid),
                likesCount: firebase.firestore.FieldValue.increment(-1)
            });
            if (ownerId && ownerId !== uid) {
                await db.collection('users').doc(ownerId).update({
    totalLikes: firebase.firestore.FieldValue.increment(-1)
});
            }
        } else {
            await ref.update({
                likedBy:    firebase.firestore.FieldValue.arrayUnion(uid),
                likesCount: firebase.firestore.FieldValue.increment(1)
            });
            if (ownerId && ownerId !== uid) {
                await db.collection('users').doc(ownerId).update({
                    totalLikes: firebase.firestore.FieldValue.increment(1)
                });
                try {
                    const meDoc  = await db.collection('users').doc(uid).get();
                    const meData = meDoc.data() || {};
                    await db.collection('notifications').add({
                        receiverId:       ownerId,
                        senderId:         uid,
                        senderName:       meData.name      || t('anonymous'),
                        senderUsername:   meData.username  || '',
                        senderAvatar:     meData.avatarUrl || '',
                        isSenderVerified: !!(meData.isVerified || meData.isPremium),
                        type:             'like',
                        contentId:        id,
                        isRead:           false,
                        timestamp:        firebase.firestore.FieldValue.serverTimestamp()
                    });
                    notifyNewLike(ownerId, meData.name || 'أحدهم');
                } catch(e) { console.error('like notification:', e); }
            }
        }
    } catch(e) {
        console.error('toggleLike:', e);
        if (isLiked) {
            btn.classList.add('liked');
            if (iconEl) iconEl.className = 'fa-solid fa-heart';
            if (countSpan) countSpan.textContent = currentCount;
        } else {
            btn.classList.remove('liked');
            if (iconEl) iconEl.className = 'fa-regular fa-heart';
            if (countSpan) countSpan.textContent = currentCount;
        }
    }
}

async function deleteAnswer(answerId, questionId) {
    if (!auth.currentUser || !isOwner) return;
    const res = await confirmDialog(t('answer_delete_confirm'), t('answer_delete_desc'), t('delete_label'), true);
    if (!res.isConfirmed) return;

    const card = document.querySelector(`[data-answer-id="${answerId}"]`);
    if (card) {
        card.style.opacity    = '0';
        card.style.transform  = 'translateY(-8px)';
        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        setTimeout(() => { if (card.parentNode) card.remove(); }, 300);
    }

    try {
        const ansDoc     = await db.collection('answers').doc(answerId).get();
        const ansData    = ansDoc.exists ? ansDoc.data() : null;
        const likesCount = ansData ? (ansData.likesCount ?? 0) : 0;

        const batch = db.batch();
        batch.delete(db.collection('answers').doc(answerId));

        if (questionId) {
            const qDoc = await db.collection('questions').doc(questionId).get();
            if (qDoc.exists) {
                batch.update(db.collection('questions').doc(questionId), { status: 'pending' });
            }
        }

        batch.update(db.collection('users').doc(auth.currentUser.uid), {
    answersCount: firebase.firestore.FieldValue.increment(-1),
    anonCoins:    firebase.firestore.FieldValue.increment(-likesCount),
    totalLikes:   firebase.firestore.FieldValue.increment(-likesCount)
});

        await batch.commit();
        toast('success', t('answer_deleted'));
    } catch(e) {
        console.error('deleteAnswer:', e);
        if (card) {
            card.style.opacity   = '1';
            card.style.transform = 'translateY(0)';
        }
        toast('error', t('generic_error'));
    }
}

async function calculateTotalLikes(uid) {
    try {
        const snap = await db.collection('answers').where('userId','==',uid).get();
        let total = 0;
        snap.forEach(d => {
            const data = d.data();
            total += data.likesCount ?? (Array.isArray(data.likedBy) ? data.likedBy.length : 0);
        });
        document.getElementById('count-likes').textContent = total.toLocaleString();
    } catch(e) { console.error('calculateTotalLikes:', e); }
}

async function sendShout() {
    if (!auth.currentUser || !isOwner) return;

    const now = Date.now();
    if (now - lastShoutSentAt < RATE_LIMIT_MS) return toast('warning', t('rate_limit'));

    const rawText = document.getElementById('shoutInput').value.trim();
    if (!rawText)             return toast('warning', t('shout_empty'));
    if (rawText.length > 500) return toast('warning', t('text_too_long'));

    const cleanedText = ModerationManager.cleanContent(rawText);
    lastShoutSentAt   = now;

    const freshDoc  = await db.collection('users').doc(auth.currentUser.uid).get();
    const freshData = freshDoc.data() || {};

    const senderName   = isShoutPublicMode ? (freshData.name     || t('anonymous')) : t('anonymous');
    const senderUname  = isShoutPublicMode ? (freshData.username || '')             : '';
    const senderAvatar = isShoutPublicMode ? (freshData.avatarUrl || auth.currentUser?.photoURL || '') : '';
    const senderId     = isShoutPublicMode ? auth.currentUser.uid : null;

    try {
        let receiverIds = [];
        try {
            const followersSnap = await db.collection('users').doc(currentProfileId)
                .collection('followers').get();
            receiverIds = followersSnap.docs.map(d => d.id);
        } catch(followerErr) {
            console.warn('Could not fetch followers:', followerErr);
        }

        await db.collection('shouts').add({
            ownerId:        currentProfileId,
            senderId,
            senderName,
            senderUsername: senderUname,
            senderAvatar,
            text:           cleanedText,
            isAnonymous:    !isShoutPublicMode,
            likesCount:     0,
            likedBy:        [],
            repliesCount:   0,
            receivers:      receiverIds,
            createdAt:      firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('shoutInput').value = '';
        document.getElementById('shoutFilterWarn')?.classList.remove('show');
        toast('success', t('shout_sent'));

        if (document.getElementById('tab-shouts').classList.contains('active')) {
            loadShouts(currentProfileId);
        }
    } catch(e) {
        console.error('sendShout error:', e);
        lastShoutSentAt = 0;
        toast('error', t('send_error'));
    }
}

async function loadShouts(uid) {
    const tab = document.getElementById('tab-shouts');
    tab.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';

    try {
        const snap = await db.collection('shouts')
            .where('ownerId', '==', uid)
            .orderBy('createdAt', 'desc')
            .limit(30)
            .get();

        tab.innerHTML = '';
        if (snap.empty) {
            tab.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comment-dots" aria-hidden="true"></i><p>${escapeHtml(t('no_shouts'))}</p></div>`;
            return;
        }
        const frag = document.createDocumentFragment();
        snap.forEach(d => frag.appendChild(buildShoutCard(d.id, d.data())));
        tab.appendChild(frag);
    } catch(e) {
        console.error('loadShouts:', e);
        tab.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><p>${escapeHtml(t('generic_error'))}</p></div>`;
    }
}

}

async function likeSubreply(shoutId, replyId, subId, btn) {
    if (!auth.currentUser) return;
    const uid=auth.currentUser.uid;
    const ref=db.collection('shouts').doc(shoutId).collection('replies').doc(replyId).collection('subreplies').doc(subId);
    const snap=await ref.get();
    const current=snap.data()?.likesCount||0;
    const liked=(snap.data()?.likedBy||[]).includes(uid);

    if (liked) {
        const n=Math.max(0,current-1);
        await ref.update({likedBy:firebase.firestore.FieldValue.arrayRemove(uid),likesCount:n});
        btn.classList.remove('liked'); btn.innerHTML=`<i class="fa-regular fa-heart" aria-hidden="true"></i> ${n}`;
    } else {
        const n=current+1;
        await ref.update({likedBy:firebase.firestore.FieldValue.arrayUnion(uid),likesCount:n});
        btn.classList.add('liked'); btn.innerHTML=`<i class="fa-solid fa-heart" aria-hidden="true"></i> ${n}`;
    }
}

async function deleteSubreply(shoutId, replyId, subId) {
    const res=await confirmDialog(t('delete_subreply'),'',t('delete_label'),true);
    if (!res.isConfirmed) return;
    await db.collection('shouts').doc(shoutId).collection('replies').doc(replyId)
        .collection('subreplies').doc(subId).delete();
}

async function confirmDeactivate() {
    const res=await confirmDialog(t('deactivate_title'),t('deactivate_text'),t('deactivate_confirm'),true);
    if (!res.isConfirmed||!auth.currentUser) return;
    await db.collection('users').doc(auth.currentUser.uid).update({isDeactivated:true});
    auth.signOut().then(()=>location.href='signin.html');
}

async function confirmDeleteAccount() {
    const res=await Swal.fire({
        ...swalBase, icon:'error', iconColor:'#ff4b4b',
        title:t('delete_account_title'), text:t('delete_account_text'),
        showCancelButton:true,
        confirmButtonText:t('delete_account_confirm'), cancelButtonText:t('cancel_btn'),
        customClass:{...swalBase.customClass, confirmButton:'swal-confirm-danger'}
    });
    if (!res.isConfirmed||!auth.currentUser) return;
    await db.collection('users').doc(auth.currentUser.uid).delete();
    await auth.currentUser.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());
    await auth.currentUser.delete();
    location.href='signin.html';
}

function showVerificationMessage(type) {
    toast('success', type==='admin' ? t('badge_admin') : t('badge_user'), 2500);
}
