    <style>
        :root{
            --primary:#f80566;--bg:#050505;--card:#0d0d0d;--border:rgba(255,255,255,0.06);
            --gold:#ffcc00;--admin-red:#ff002b;--verify-blue:#00bfff;
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}

        body{
            background:var(--bg);color:white;font-family:'Cairo',sans-serif;
            margin:0;padding-bottom:100px;overflow-x:hidden;
            contain: style;
        }

        /* ═══ SWAL ═══ */
        .swal-popup{border-radius:24px!important;border:1px solid rgba(255,255,255,0.07)!important;box-shadow:0 20px 60px rgba(0,0,0,0.8)!important;backdrop-filter:blur(20px)!important;}
        .swal-title{font-size:17px!important;font-weight:900!important;color:#fff!important;}
        .swal-html{font-size:13px!important;color:#888!important;font-weight:600!important;line-height:1.6!important;}
        .swal-confirm{background:linear-gradient(135deg,#f80566,#c0004e)!important;border-radius:50px!important;font-family:'Cairo',sans-serif!important;font-weight:800!important;font-size:13px!important;padding:10px 28px!important;box-shadow:0 4px 15px rgba(248,5,102,0.35)!important;border:none!important;}
        .swal-confirm-danger{background:linear-gradient(135deg,#ff4b4b,#c00)!important;border-radius:50px!important;font-family:'Cairo',sans-serif!important;font-weight:800!important;font-size:13px!important;padding:10px 28px!important;box-shadow:0 4px 15px rgba(255,75,75,0.35)!important;border:none!important;}
        .swal-cancel{background:rgba(255,255,255,0.06)!important;color:#aaa!important;border-radius:50px!important;font-family:'Cairo',sans-serif!important;font-weight:800!important;font-size:13px!important;padding:10px 28px!important;border:1px solid rgba(255,255,255,0.08)!important;}
        .swal-input-field{background:#0e0e0e!important;border:1px solid rgba(255,255,255,0.08)!important;border-radius:14px!important;color:#fff!important;font-family:'Cairo',sans-serif!important;font-size:13px!important;}

        /* ═══ HEADER ═══ */
        header{
            padding:10px 5%;display:flex;justify-content:space-between;align-items:center;
            position:sticky;top:0;z-index:1000;
            background:rgba(5,5,5,0.85);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid var(--border);
        }
        .logo-img{width:35px;height:auto;}
        .lang-select{
            background:rgba(255,255,255,0.05);border:1px solid var(--border);
            color:white;padding:5px 10px;border-radius:50px;font-size:11px;font-weight:700;cursor:pointer;
        }

        /* ═══ LAYOUT ═══ */
        .main-wrapper{max-width:600px;margin:0 auto;width:100%;position:relative;z-index:5;}

        .cover-wrapper{
            height:160px;background:#0a0a0a;position:relative;
            border-bottom:1px solid var(--border);overflow:hidden;
        }
        .cover-wrapper.is-owner{cursor:pointer;}
        .cover-img{width:100%;height:100%;object-fit:cover;display:none;}

        .profile-main{margin:-55px auto 0;text-align:center;position:relative;z-index:10;padding:0 15px;}

        .avatar-container{
            width:110px;height:110px;margin:0 auto;border-radius:50%;
            border:4px solid var(--bg);background:#111;position:relative;z-index:2;
        }
        .avatar-container.is-owner{cursor:pointer;}
        .avatar-container::after{
            content:'';position:absolute;bottom:-2px;left:0;
            width:100%;height:55px;
            border-bottom-left-radius:55px;border-bottom-right-radius:55px;
            z-index:-1;filter:blur(8px);opacity:0.9;
        }
        .avatar-container.admin-glow::after{background-color:var(--admin-red);}
        .avatar-container.verify-glow::after{background-color:var(--verify-blue);}
        .avatar-img{width:100%;height:100%;border-radius:50%;object-fit:cover;}

        .profile-username{font-size:12px;color:#555;font-weight:700;margin-top:3px;letter-spacing:0.3px;}
        .profile-username span{color:#444;}

        /* ═══ INTERACTION BAR ═══ */
        .interaction-bar{display:none;align-items:center;justify-content:center;gap:10px;margin:15px 0;}
        .interaction-bar.visible{display:flex;}
        .follow-btn{padding:8px 30px;border-radius:50px;border:none;font-weight:800;font-family:'Cairo';cursor:pointer;font-size:13px;transition:background 0.25s,color 0.25s;}
        .follow-btn.unfollowed{background:white;color:black;}
        .follow-btn.followed{background:rgba(255,255,255,0.1);color:white;border:1px solid var(--border);}
        .notify-btn{
            width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
            background:rgba(255,255,255,0.05);color:#555;
            display:none;align-items:center;justify-content:center;cursor:pointer;
            transition:color 0.2s,border-color 0.2s,background 0.2s;font-size:14px;
        }
        .notify-btn.show{display:flex;}
        .notify-btn.active{color:var(--gold);border-color:var(--gold);background:rgba(255,204,0,0.1);}

        /* ═══ STATS ═══ */
        .stats-bar{
            display:inline-flex;background:rgba(255,255,255,0.03);
            padding:8px 25px;border-radius:50px;border:1px solid var(--border);
            gap:20px;margin:15px 0;
        }
        .stat-item{display:flex;flex-direction:column;align-items:center;min-width:50px;}
        .stat-val{font-weight:900;font-size:13px;}
        .stat-label{font-size:9px;color:#666;font-weight:700;}

        /* ═══ ASK BOX ═══ */
        .ask-container{
            background:#0a0a0a;border-radius:25px;padding:20px;
            margin:20px 15px;border:1px solid var(--border);
            box-shadow:0 10px 30px rgba(0,0,0,0.4);
        }
        .ask-input{
            width:100%;background:#0e0e0e;border:1px solid var(--border);
            border-radius:15px;color:white;padding:15px;font-family:'Cairo';
            resize:none;min-height:100px;font-size:14px;
            transition:border-color 0.2s;
        }
        .ask-input:focus{border-color:rgba(248,5,102,0.3);}

        .mode-switch-row{
            display:flex;align-items:center;justify-content:space-between;
            margin-bottom:12px;padding-bottom:12px;
            border-bottom:1px solid rgba(255,255,255,0.05);
        }
        .mode-switch-wrapper{display:flex;align-items:center;gap:10px;}
        .mode-label-anon{font-size:11px;font-weight:800;color:#888;transition:color 0.3s;}
        .mode-label-public{font-size:11px;font-weight:800;color:#888;transition:color 0.3s;}
        .mode-label-anon.active-label{color:var(--primary);}
        .mode-label-public.active-label{color:#00bfff;}

        .switch-toggle{position:relative;width:48px;height:26px;cursor:pointer;}
        .switch-toggle input{opacity:0;width:0;height:0;position:absolute;}
        .switch-slider{
            position:absolute;inset:0;background:#1a1a1a;border-radius:50px;
            border:1px solid rgba(255,255,255,0.08);transition:background 0.35s,border-color 0.35s;
        }
        .switch-slider::before{
            content:'';position:absolute;width:20px;height:20px;border-radius:50%;
            background:var(--primary);bottom:2px;right:3px;
            transition:transform 0.35s,background 0.35s;
            box-shadow:0 2px 6px rgba(248,5,102,0.5);
        }
        .switch-toggle input:checked+.switch-slider{background:#0a1a2a;border-color:rgba(0,191,255,0.2);}
        .switch-toggle input:checked+.switch-slider::before{transform:translateX(-22px);background:#00bfff;box-shadow:0 2px 6px rgba(0,191,255,0.5);}
        [dir="ltr"] .switch-slider::before{right:auto;left:3px;}
        [dir="ltr"] .switch-toggle input:checked+.switch-slider::before{transform:translateX(22px);}

        .mode-indicator-badge{
            display:inline-flex;align-items:center;gap:5px;padding:4px 12px;
            border-radius:50px;font-size:10px;font-weight:800;margin-bottom:10px;
            transition:background 0.3s,color 0.3s,border-color 0.3s;
        }
        .mode-indicator-badge.anon-mode{background:rgba(248,5,102,0.1);color:var(--primary);border:1px solid rgba(248,5,102,0.2);}
        .mode-indicator-badge.public-mode{background:rgba(0,191,255,0.08);color:#00bfff;border:1px solid rgba(0,191,255,0.15);}

        .send-q-btn{
            width:100%;margin-top:8px;padding:12px;border-radius:15px;
            background:var(--primary);color:white;border:none;font-weight:800;
            cursor:pointer;font-family:'Cairo';font-size:13px;
            transition:opacity 0.2s,background 0.3s;
        }
        .send-q-btn:active{opacity:0.85;}
        .send-q-btn.public-mode-btn{background:linear-gradient(135deg,#0055aa,#0099dd);}

        .hint-text{
            text-align:center;color:rgba(255,255,255,0.15);
            font-size:10px;font-weight:800;margin-top:15px;
            letter-spacing:2px;text-transform:uppercase;
        }

        /* ═══ TABS ═══ */
        .nav-tabs{
            display:flex;gap:8px;justify-content:center;
            margin:20px 0;padding:0 15px;flex-wrap:wrap;
        }
        .tab-btn{
            background:rgba(255,255,255,0.05);border:1px solid var(--border);
            color:#777;padding:8px 18px;border-radius:50px;
            font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo';
            transition:background 0.2s,color 0.2s,border-color 0.2s;
        }
        .tab-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
        .tab-content{display:none;padding:0 15px;animation:fadeIn 0.3s ease;}
        .tab-content.active{display:block;}

        /* ═══ ANSWER CARD ═══ */
        .ans-card{
            background:var(--card);border-radius:24px;padding:22px;
            margin-bottom:20px;border:1px solid var(--border);
            animation:slideIn 0.4s ease;position:relative;overflow:visible;
        }
        .ans-card.dev-glow{border-color:rgba(255,0,43,0.3);box-shadow:0 0 20px rgba(255,0,43,0.12);}
        .ans-card.user-glow{border-color:rgba(0,191,255,0.3);box-shadow:0 0 20px rgba(0,191,255,0.12);}
        .ans-header{display:flex;align-items:center;gap:12px;margin-bottom:15px;}
        .avatar-frame{width:45px;height:45px;border-radius:50%;position:relative;cursor:pointer;flex-shrink:0;}
        .avatar-frame img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg);}
        .avatar-frame.admin-glow::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:var(--admin-red);filter:blur(6px);opacity:0.5;z-index:-1;}
        .avatar-frame.verify-glow::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:var(--verify-blue);filter:blur(6px);opacity:0.5;z-index:-1;}
        .user-info-text{display:flex;flex-direction:column;flex:1;cursor:pointer;}
        .ans-display-name{font-weight:800;font-size:14px;color:#fff;line-height:1.2;}
        .ans-user-name-sub{font-weight:400;font-size:11px;color:#888;}
        .ans-q{font-size:13px;color:#aaa;margin-bottom:12px;line-height:1.6;}
        .ans-a{
            font-size:15px;font-weight:700;color:#fff;
            background:rgba(255,255,255,0.02);padding:15px;border-radius:15px;
            border-right:4px solid var(--primary);word-break:break-word;
        }
        [dir="ltr"] .ans-a{border-right:none;border-left:4px solid var(--primary);}
        .ans-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
        .ans-actions{display:flex;gap:20px;}
        .action-btn{
            background:none;border:none;color:#666;font-size:13px;font-weight:700;
            cursor:pointer;display:flex;align-items:center;gap:7px;
            transition:color 0.2s;font-family:'Cairo';
        }
        .action-btn.liked{color:var(--primary);}
        .ans-time-container{text-align:left;line-height:1.2;}
        .ans-time{display:block;font-size:10px;color:var(--primary);font-weight:900;}
        .ans-date-sub{display:block;font-size:9px;color:#555;font-weight:600;}

        /* ═══ SHOUT CARD ═══ */
        .shout-card{
            background:var(--card);border-radius:22px;padding:18px;
            margin-bottom:15px;border:1px solid var(--border);
            position:relative;cursor:pointer;
            transition:border-color 0.2s;
        }
        .shout-card:hover{border-color:rgba(248,5,102,0.25);}
        .shout-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
        .shout-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
        .shout-owner-name{font-size:13px;font-weight:800;color:#fff;}
        .shout-time{font-size:10px;color:#555;font-weight:700;}
        .shout-text{font-size:14px;font-weight:700;color:#fff;line-height:1.6;margin-bottom:12px;word-break:break-word;}
        .shout-footer{display:flex;justify-content:space-between;align-items:center;}
        .shout-actions{display:flex;gap:14px;}
        .shout-action-btn{
            background:none;border:none;color:#555;font-size:11px;font-weight:700;
            cursor:pointer;display:flex;align-items:center;gap:5px;
            font-family:'Cairo';transition:color 0.2s;
        }
        .shout-action-btn:hover{color:#999;}
        .shout-action-btn.liked{color:var(--primary);}

        /* ═══ SHOUT MODAL ═══ */
        .shout-modal-overlay{
            position:fixed;inset:0;background:rgba(0,0,0,0.95);
            z-index:2000;display:flex;flex-direction:column;
            overflow:hidden;animation:fadeIn 0.2s ease;
        }
        .shout-modal{background:var(--bg);width:100%;max-width:600px;margin:auto;height:100%;display:flex;flex-direction:column;}
        .shout-modal-header{
            padding:14px 16px;border-bottom:1px solid var(--border);
            display:flex;align-items:center;gap:12px;
            position:sticky;top:0;background:var(--bg);z-index:10;
        }
        .shout-modal-back{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:8px;font-family:'Cairo';}
        .shout-modal-title{font-size:15px;font-weight:900;color:#fff;}
        .shout-modal-body{flex:1;overflow-y:auto;padding:16px;}
        .shout-original{background:#0a0a0a;border-radius:18px;padding:16px;margin-bottom:16px;border:1px solid var(--border);}
        .shout-original-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
        .shout-original-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
        .shout-original-sender{font-size:13px;font-weight:800;color:var(--primary);}
        .shout-original-time{font-size:10px;color:#555;font-weight:700;}
        .shout-original-text{font-size:15px;font-weight:700;color:#fff;line-height:1.6;margin:8px 0 12px;}
        .shout-original-actions{display:flex;gap:14px;align-items:center;}
        .shout-original-like-btn{background:none;border:none;color:#555;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Cairo';transition:color 0.2s;}
        .shout-original-like-btn.liked{color:var(--primary);}
        .shout-answer-box{background:#0a0a0a;border-radius:16px;padding:14px;margin-bottom:16px;border:1px solid rgba(248,5,102,0.2);}
        .shout-answer-box-title{font-size:11px;font-weight:800;color:var(--primary);margin-bottom:10px;}
        .shout-answer-input{width:100%;background:#0e0e0e;border:1px solid var(--border);border-radius:12px;color:white;padding:12px;font-family:'Cairo';resize:none;font-size:13px;min-height:80px;}
        .shout-answer-send-btn{width:100%;margin-top:8px;padding:10px;border-radius:12px;background:var(--primary);color:white;border:none;font-weight:800;cursor:pointer;font-family:'Cairo';font-size:13px;}
        .replies-section{margin-top:8px;}
        .replies-title{font-size:11px;font-weight:800;color:#555;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
        .reply-card{background:#0a0a0a;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--border);transition:border-color 0.2s;}
        .reply-card:hover{border-color:rgba(248,5,102,0.2);}
        .reply-card.is-answer{border-right:3px solid var(--primary);}
        [dir="ltr"] .reply-card.is-answer{border-right:none;border-left:3px solid var(--primary);}
        .reply-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
        .reply-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border);}
        .reply-sender-name{font-size:12px;font-weight:800;color:var(--primary);}
        .reply-answer-badge{font-size:9px;font-weight:800;color:var(--primary);background:rgba(248,5,102,0.1);padding:2px 6px;border-radius:20px;margin-right:4px;}
        [dir="ltr"] .reply-answer-badge{margin-right:0;margin-left:4px;}
        .reply-time{font-size:10px;color:#555;font-weight:700;margin-right:auto;}
        [dir="ltr"] .reply-time{margin-right:0;margin-left:auto;}
        .reply-text{font-size:13px;color:#ddd;font-weight:600;line-height:1.5;word-break:break-word;}
        .reply-actions{display:flex;gap:12px;margin-top:8px;align-items:center;}
        .reply-like-btn{background:none;border:none;color:#555;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'Cairo';}
        .reply-like-btn.liked{color:var(--primary);}
        .reply-delete-btn{background:none;border:none;color:#333;font-size:11px;cursor:pointer;margin-right:auto;font-family:'Cairo';}
        [dir="ltr"] .reply-delete-btn{margin-right:0;margin-left:auto;}
        .reply-delete-btn:hover{color:#ff4b4b;}
        .subreply-card{background:#111;border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.04);}
        .subreply-header{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
        .subreply-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--border);}
        .subreply-sender-name{font-size:11px;font-weight:800;color:#aaa;}
        .subreply-time{font-size:9px;color:#444;font-weight:700;margin-right:auto;}
        [dir="ltr"] .subreply-time{margin-right:0;margin-left:auto;}
        .subreply-text{font-size:12px;color:#bbb;font-weight:600;line-height:1.4;word-break:break-word;}
        .subreply-actions{display:flex;gap:10px;margin-top:6px;}

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   ModerationManager — Singleton مُحسَّن
══════════════════════════════════════════════════════════════ */
const ModerationManager = (() => {
    const BAD_WORDS = {
        ar: ["كلمة_سيئة_1","كلمة_سيئة_2"],
        en: ["badword1","badword2"],
        fr: ["motinterdit1","motinterdit2"]
    };
    const forbiddenSet = new Set(
        Object.values(BAD_WORDS).flat().filter(w => w && w.trim()).map(w => w.trim().toLowerCase())
    );
    const patterns = [...forbiddenSet].map(word => ({
        word,
        regex: new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi')
    }));

    function cleanContent(text) {
        if (!text) return text;
        let result = text;
        for (const {regex} of patterns) result = result.replace(regex, '****');
        return result;
    }
    function containsBadWords(text) {
        if (!text) return false;
        const lower = text.toLowerCase();
        for (const word of forbiddenSet) { if (lower.includes(word)) return true; }
        return false;
    }
    return { cleanContent, containsBadWords };
})();

/* ══════════════════════════════════════
   SWAL CONFIG
══════════════════════════════════════ */
const swalBase = {
    background:'linear-gradient(145deg,#0d0d0d,#111)',
    color:'#fff',fontFamily:'Cairo, sans-serif',
    customClass:{
        popup:'swal-popup',title:'swal-title',
        htmlContainer:'swal-html',confirmButton:'swal-confirm',
        cancelButton:'swal-cancel',input:'swal-input-field',
    }
};

const toast = (icon, text, timer=1800) => Swal.fire({
    ...swalBase,icon,text,timer,
    toast:true,position:'bottom',showConfirmButton:false,timerProgressBar:true,
    iconColor:icon==='success'?'#00e676':icon==='error'?'#f80566':icon==='warning'?'#ffcc00':'#fff',
});

const confirmDialog = (title, text='', confirmTxt='تأكيد', dangerMode=false) => Swal.fire({
    ...swalBase,
    icon:dangerMode?'warning':'question',
    iconColor:dangerMode?'#ff4b4b':'#f80566',
    title,text,showCancelButton:true,
    confirmButtonText:confirmTxt,cancelButtonText:t('cancel_btn'),
    customClass:{...swalBase.customClass,confirmButton:dangerMode?'swal-confirm-danger':'swal-confirm'}
});

/* ══════════════════════════════════════
   TRANSLATIONS
══════════════════════════════════════ */
const translations = {
    ar:{
        followers:"متابعون",answers:"إجابات",likes:"إعجابات",
        latest:"الأحدث",featured:"الأبرز",shout_tab:"شاوت",account:"الحساب",
        name_label:"الاسم الكامل",bio_label:"نبذة عني (Bio)",

   HELPERS
══════════════════════════════════════ */
const t = k => translations[currentLang]?.[k] ?? translations['ar']?.[k] ?? k;

const _escEl = document.createElement('div');
function escapeHtml(s) {
    _escEl.textContent = String(s ?? '');
    return _escEl.innerHTML;
}

function safeImgSrc(url, fallback='images/user.png') {
    if (!url) return fallback;
    try {
        const u = new URL(url);
        return u.protocol === 'https:' ? url : fallback;
    } catch { return fallback; }
}

function sanitizeId(id) {
    return (id || '').replace(/[^a-zA-Z0-9_-]/g, '');
}

const _fmt = {};
function getFormatter(lang, opts) {
    const key = lang + JSON.stringify(opts);
    if (!_fmt[key]) _fmt[key] = new Intl.DateTimeFormat(lang === 'ar' ? 'ar-EG' : 'en-GB', opts);
    return _fmt[key];
}

const formatDate = ts => {
    if (!ts) return '';
    return getFormatter(currentLang, {year:'numeric',month:'short',day:'numeric'}).format(new Date(ts.seconds * 1000));
};
const formatTime = ts => {
    if (!ts) return '';
    return getFormatter(currentLang, {hour:'2-digit',minute:'2-digit'}).format(new Date(ts.seconds * 1000));
};

function timeAgo(ts) {
    if (!ts) return '';
    const m = Math.floor((Date.now() - ts.seconds * 1000) / 60000);
    if (m < 1)  return currentLang === 'ar' ? 'الآن' : 'Now';
    if (m < 60) return currentLang === 'ar' ? m+'د'  : m+'m';
    const h = Math.floor(m / 60);
    if (h < 24) return currentLang === 'ar' ? h+'س'  : h+'h';
    return currentLang === 'ar' ? Math.floor(h/24)+'ي' : Math.floor(h/24)+'d';
}

/* ══════════════════════════════════════
   CLOUDINARY
══════════════════════════════════════ */
const ALLOWED_TYPES = new Set(['image/jpeg','image/jpg','image/png','image/webp']);

function validateImageFile(f) {
    if (!ALLOWED_TYPES.has(f.type)) { toast('error', t('upload_error_type')); return false; }
    if (f.size > 5 * 1024 * 1024)  { toast('error', t('upload_error_size')); return false; }
    return true;
}

async function uploadToCloudinary(file, type) {
    if (!auth.currentUser || auth.currentUser.uid !== currentProfileId) return;
    if (!validateImageFile(file)) return;

    const uid        = auth.currentUser.uid;
    const cloudName  = APP_CONFIG.cloudinary.cloudName;
    const preset     = APP_CONFIG.cloudinary.uploadPreset;
    const publicId   = type === 'avatar' ? `anon_users/${uid}/avatar` : `anon_users/${uid}/cover`;

    Swal.fire({...swalBase, title:'⏳ '+t('uploading'), allowOutsideClick:false, showConfirmButton:false,
        didOpen:()=>Swal.showLoading()});

    try {
        const formData = new FormData();
        formData.append('file',            file);
        formData.append('upload_preset',   preset);
        formData.append('public_id',       publicId);

        const res = await fetch(
            `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`,
            {method:'POST', body:formData}
        );
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error?.message || 'Cloudinary error');
        }

        const data     = await res.json();
        const freshUrl = `${data.secure_url}?v=${data.version || Date.now()}`;
        const updateObj = {[type === 'avatar' ? 'avatarUrl' : 'coverUrl']: data.secure_url};

        if (type === 'avatar') {
            document.getElementById('avatarImg').src = freshUrl;
        } else {
            const c = document.getElementById('coverImg');
            c.src = freshUrl;
            c.style.display = 'block';
        }

        await db.collection('users').doc(uid).update(updateObj);
        Swal.close();
        toast('success', t('upload_success'));
    } catch(e) {
        console.error('Upload error:', e);
        Swal.fire({
            ...swalBase, icon:'error', iconColor:'#f80566',
            title:'❌ '+t('upload_fail'), text:e.message, confirmButtonText:t('ok_btn')
        });
    }
}

document.getElementById('avatarInput').addEventListener('change', function(e){
    const f = e.target.files[0]; if(f) uploadToCloudinary(f,'avatar'); this.value='';
});
document.getElementById('coverInput').addEventListener('change', function(e){
    const f = e.target.files[0]; if(f) uploadToCloudinary(f,'cover'); this.value='';
});

function updateSEO(name, bio, avatarUrl, username) {
    const pageUrl = `${location.origin}${location.pathname}?id=${currentProfileId}`;
    const desc    = bio
        ? `${name} على Anon — ${bio.slice(0,120)}`
        : `تصفّح ملف ${name} على منصة Anon وأرسل سؤالاً مجهولاً.`;
    const img = avatarUrl || 'images/logo.png';
    const full = `${name} (@${username}) | Anon`;

    document.title                                          = full;
    document.getElementById('seoTitle').textContent         = full;
    document.getElementById('seoDesc').content              = desc;
    document.getElementById('seoCanonical').href            = pageUrl;
    ['ogTitle','twTitle'].forEach(id  => document.getElementById(id).content = full);
    ['ogDesc','twDesc'].forEach(id    => document.getElementById(id).content = desc);
    ['ogImage','twImage'].forEach(id  => document.getElementById(id).content = img);
    document.getElementById('ogUrl').content                = pageUrl;

    document.getElementById('schemaScript').textContent = JSON.stringify({
        "@context":"https://schema.org","@type":"ProfilePage",
        "name":`${name} | Anon`,"url":pageUrl,"description":desc,
        "mainEntity":{"@type":"Person","name":name,"alternateName":`@${username}`,"image":img,"description":bio||''},
        "publisher":{"@type":"Organization","name":"Anon","logo":{"@type":"ImageObject","url":`${location.origin}/images/logo.png`}}
    });
}

/* ══════════════════════════════════════
   SEND QUESTION
══════════════════════════════════════ */
async function sendQuestion() {
    if (!auth.currentUser || isOwner) return;
    if (isBlocked || iBlockedByThem) return;

    const now = Date.now();
    if (now - lastQuestionSentAt < RATE_LIMIT_MS) return toast('warning', t('rate_limit'));

    const rawText = document.getElementById('qInput').value.trim();
    if (!rawText)              return toast('warning', t('question_empty'));
    if (rawText.length > 500)  return toast('warning', t('question_too_long'));

    const cleanedText = ModerationManager.cleanContent(rawText);
    lastQuestionSentAt = now;

    try {
        await db.collection('questions').add({
            receiverId:     currentProfileId,
            senderId:       isPublicMode ? auth.currentUser.uid : null,
            senderName:     isPublicMode ? (currentUserData?.name     || t('anonymous')) : null,
            senderUsername: isPublicMode ? (currentUserData?.username || '')             : null,
            senderAvatar:   isPublicMode ? (currentUserData?.avatarUrl|| '')             : null,
            isAnonymous:    !isPublicMode,
            question:       cleanedText,
            status:         'pending',
            answer:         '',
            likesCount:     0,
            likedBy:        [],
            createdAt:      firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('qInput').value = '';
        document.getElementById('qFilterWarn')?.classList.remove('show');
        toast('success', t('question_sent'));
    } catch(e) {
        console.error(e);
        lastQuestionSentAt = 0;
        toast('error', t('send_error'));
    }
}

/* ══════════════════════════════════════
   AUTH
══════════════════════════════════════ */
auth.onAuthStateChanged(async user => {
    if (!user) return (location.href = 'signin.html');

    const meDoc = await db.collection('users').doc(user.uid).get();
    currentUserData = meDoc.data() || {};

    document.getElementById('userCoins').textContent = (currentUserData.anonCoins || 0).toFixed(2);
    db.collection('users').doc(user.uid).onSnapshot(snap => {
        const d = snap.data();
        if (d) document.getElementById('userCoins').textContent = (d.anonCoins || 0).toFixed(2);
    });

    const rawId = new URLSearchParams(location.search).get('id') || user.uid;
    currentProfileId = sanitizeId(rawId);
    if (!currentProfileId) return (location.href = 'signin.html');

    isOwner = (currentProfileId === user.uid);

    if (!isOwner) {
        await checkMutualBlock(user.uid, currentProfileId);
    }

    loadProfileData(currentProfileId, isOwner);

    if (isOwner) {
        document.getElementById('accountTabBtn').style.display = 'block';
        document.getElementById('shoutTabBtn').style.display   = 'block';
        document.getElementById('avatarBox').classList.add('is-owner');
        document.getElementById('coverWrapper').classList.add('is-owner');
        document.getElementById('avatarBox').addEventListener('click', () => document.getElementById('avatarInput').click());
        document.getElementById('coverWrapper').addEventListener('click', () => document.getElementById('coverInput').click());
        document.getElementById('interactionBar').classList.remove('visible');
        document.getElementById('ownerShoutBox').style.display = 'block';
        document.getElementById('visitorAskBox').style.display = 'none';
    } else {
        document.getElementById('interactionBar').classList.add('visible');
        document.getElementById('visitorAskBox').style.display = (isBlocked || iBlockedByThem) ? 'none' : 'block';
        document.getElementById('ownerShoutBox').style.display = 'none';
        checkFollowStatus();
        checkBlockStatus(currentProfileId);
    }

    listenToPendingQuestions(user.uid);

    currentLang = localStorage.getItem('lang') || 'ar';
    document.getElementById('langSelect').value = currentLang;
    updateLanguage(currentLang);
});

/* ══════════════════════════════════════
   CHECK MUTUAL BLOCK
══════════════════════════════════════ */
async function checkMutualBlock(myUid, profileId) {
    try {
        const [myBlockDoc, theirBlockDoc] = await Promise.all([
            db.collection('users').doc(myUid).collection('blocked').doc(profileId).get(),
            db.collection('users').doc(profileId).collection('blocked').doc(myUid).get()
        ]);
        isBlocked      = myBlockDoc.exists;
        iBlockedByThem = theirBlockDoc.exists;

        if (isBlocked || iBlockedByThem) {
            showBlockedScreen();
        }
    } catch(e) {
        console.error('checkMutualBlock error:', e);
    }
}

/* ══════════════════════════════════════
   PENDING QUESTIONS LISTENER
══════════════════════════════════════ */
function listenToPendingQuestions(uid) {
    if (questionsListener) { questionsListener(); questionsListener = null; }
    initialQuestionsLoaded = false;
    questionsListener = db.collection('questions')
        .where('receiverId', '==', uid)
        .where('status', '==', 'pending')
        .onSnapshot(snap => {
            const badge = document.getElementById('qBadgeNav');
            if (!snap.empty) {
                badge.style.display = 'flex';
                badge.textContent   = snap.size;
                if (initialQuestionsLoaded) {
                    snap.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            document.getElementById('sndQuestion')?.play().catch(()=>{});
                        }
                    });
                }
            } else {
                badge.style.display = 'none';
            }
            initialQuestionsLoaded = true;
        });
}

/* ══════════════════════════════════════
   FOLLOW NOTIFICATION
══════════════════════════════════════ */
async function sendFollowNotification(followerUid, profileOwnerUid) {
    try {
        const followerDoc  = await db.collection('users').doc(followerUid).get();
        const followerData = followerDoc.data() || {};
        await db.collection('notifications').add({
            receiverId:       profileOwnerUid,
            senderId:         followerUid,
            senderName:       followerData.name       || t('anonymous'),
            senderUsername:   followerData.username   || '',
            senderAvatar:     followerData.avatarUrl  || '',
            isSenderVerified: !!(followerData.isVerified || followerData.isPremium),
            type:             'follow',
            contentId:        followerUid,
            isRead:           false,
            timestamp:        firebase.firestore.FieldValue.serverTimestamp()
        });
    } catch(e) { console.error('sendFollowNotification:', e); }
}

/* ══════════════════════════════════════
   LANGUAGE
══════════════════════════════════════ */
function updateLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-key]').forEach(el => {
        const v = translations[lang]?.[el.dataset.key];
        if (v) el.textContent = v;
    });
    document.querySelectorAll('[data-placeholder]').forEach(el => {
        const v = translations[lang]?.[el.dataset.placeholder];
        if (v) el.placeholder = v;
    });

    const bb = document.getElementById('blockBtnText');
    if (bb) bb.textContent = isBlocked ? t('unblock_btn') : t('block_btn');

    const followSpan = document.getElementById('followBtnText');
    if (followSpan) followSpan.textContent = isFollowing ? t('following_btn') : t('follow_btn');

    if (!isOwner) toggleQuestionMode();

    if (isBlocked || iBlockedByThem) {
        const el = document.getElementById('blockedMsg');
        if (el) el.innerHTML = t('blocked_msg');
    }
}

   COPY LINK
══════════════════════════════════════ */
function copyProfileLink() {
    const url = `${location.origin}${location.pathname}?id=${currentProfileId}`;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.resolve().then(()=>{
        const el = document.createElement('textarea');
        el.value = url; document.body.appendChild(el); el.select();
        document.execCommand('copy'); document.body.removeChild(el);
    })).then(() => toast('success', t('copy_success')));
    document.getElementById('profileActionsMenu').style.display = 'none';
}

/* ══════════════════════════════════════
   FOLLOW / NOTIFY
══════════════════════════════════════ */
function checkFollowStatus() {
    if (!auth.currentUser) return;
    if (followListener) { followListener(); followListener = null; }

    followListener = db.collection('users').doc(currentProfileId)
        .collection('followers').doc(auth.currentUser.uid)
        .onSnapshot(doc => {
            isFollowing = doc.exists;
            const btnF  = document.getElementById('btnFollow');
            const btnN  = document.getElementById('btnNotify');
            if (btnF) {
                const span = document.getElementById('followBtnText');
                if (span) span.textContent = isFollowing ? t('following_btn') : t('follow_btn');
                btnF.className = isFollowing ? 'follow-btn followed' : 'follow-btn unfollowed';
            }
            if (btnN) {
                btnN.classList.toggle('show', isFollowing);
                btnN.classList.toggle('active', isFollowing && !!(doc.data()?.notifications));
            }
        });
}

async function toggleFollow() {
    if (!auth.currentUser || isOwner) return;
    if (isBlocked || iBlockedByThem) return;
    const uid = auth.currentUser.uid;
    const ref = db.collection('users').doc(currentProfileId).collection('followers').doc(uid);
    if (isFollowing) {
        await ref.delete();
        await db.collection('users').doc(currentProfileId).update({
            followersCount: firebase.firestore.FieldValue.increment(-1)
        });
    } else {
        await ref.set({followedAt:firebase.firestore.FieldValue.serverTimestamp(), notifications:false});
        await db.collection('users').doc(currentProfileId).update({
            followersCount: firebase.firestore.FieldValue.increment(1)
        });
        await sendFollowNotification(uid, currentProfileId);
    }
}

async function toggleNotify() {
    if (!auth.currentUser || isOwner || !isFollowing) return;
    const ref = db.collection('users').doc(currentProfileId)
        .collection('followers').doc(auth.currentUser.uid);
    const doc = await ref.get();
    await ref.update({notifications:!(doc.exists && doc.data().notifications)});
}

function checkBlockStatus(profileId) {
    if (!auth.currentUser) return;
    if (blockListener) { blockListener(); blockListener = null; }

    blockListener = db.collection('users').doc(auth.currentUser.uid)
        .collection('blocked').doc(profileId)
        .onSnapshot(async doc => {
            isBlocked = doc.exists;

/* ══════════════════════════════════════
   LOAD ANSWERS
══════════════════════════════════════ */
async function loadAnswers(uid) {
    const tab = document.getElementById('tab-latest');
    tab.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';

    try {
        const ownerSnap = await db.collection('users').doc(uid).get();
        const ownerData = ownerSnap.exists ? ownerSnap.data() : {};

        db.collection('answers')
            .where('userId','==',uid)
            .orderBy('answeredAt','desc')
            .limit(50)
            .onSnapshot(snap => {
                tab.innerHTML = '';
                if (snap.empty) {
                    tab.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comment-dots" aria-hidden="true"></i><p>${escapeHtml(t('no_answers'))}</p></div>`;
                    document.getElementById('count-answers').textContent = 0;
                    return;
                }
                const frag = document.createDocumentFragment();
                let cnt = 0;
                snap.forEach(d => { cnt++; frag.appendChild(buildAnswerCard(d.id, d.data(), ownerData)); });
                tab.appendChild(frag);
                document.getElementById('count-answers').textContent = cnt.toLocaleString();
                if (typeof AdsManager !== 'undefined') AdsManager.injectAds(tab);
            });
    } catch(e) {
        console.error('loadAnswers:', e);
        tab.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><p>${escapeHtml(t('generic_error'))}</p></div>`;
    }
}

async function loadFeaturedAnswers(uid) {
    const tab = document.getElementById('tab-featured');
    if (tab.dataset.loaded) return;
    tab.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';

    try {
        const ownerSnap = await db.collection('users').doc(uid).get();
        const ownerData = ownerSnap.exists ? ownerSnap.data() : {};

        const snap = await db.collection('answers')
            .where('userId','==',uid)
            .limit(100)
            .get();

        tab.innerHTML = '';
        if (snap.empty) {
            tab.innerHTML = `<div class="empty-state"><i class="fa-regular fa-star" aria-hidden="true"></i><p>${escapeHtml(t('no_answers'))}</p></div>`;
            return;
        }

        const docs = [];
        snap.forEach(d => docs.push({id:d.id, data:d.data()}));
        docs.sort((a,b) => (b.data.likes?.length||0) - (a.data.likes?.length||0));

        const frag = document.createDocumentFragment();
        docs.slice(0,20).forEach(d => frag.appendChild(buildAnswerCard(d.id, d.data, ownerData)));
        tab.appendChild(frag);
        tab.dataset.loaded = '1';
    } catch(e) { console.error('loadFeaturedAnswers:', e); }
}

/* ══════════════════════════════════════
   BUILD ANSWER CARD
══════════════════════════════════════ */
function buildAnswerCard(id, data, ownerData) {
    const likesArr   = data.likes || [];
    const liked      = !!(auth.currentUser && likesArr.includes(auth.currentUser.uid));
    const likesCount = likesArr.length;

    const username       = (ownerData.username || '').toLowerCase();
    const isDev          = username === 'ht';
    const isVerified     = !!(ownerData.isPremium || ownerData.isVerified);
    const cardGlowClass  = isDev ? 'dev-glow' : (isVerified ? 'user-glow' : '');
    const avatarGlowClass= isDev ? 'admin-glow' : (isVerified ? 'verify-glow' : '');

    const div = document.createElement('div');
    div.className = `ans-card ${cardGlowClass}`;

    const header = document.createElement('div'); header.className = 'ans-header';

    const avatarFrame = document.createElement('div');
    avatarFrame.className = `avatar-frame ${avatarGlowClass}`;
    avatarFrame.setAttribute('role','button');
    avatarFrame.setAttribute('tabindex','0');
    avatarFrame.onclick = () => location.href = `profile.html?id=${currentProfileId}`;
    const avImg = document.createElement('img');
    avImg.src = safeImgSrc(ownerData.avatarUrl);
    avImg.alt = ownerData.name || '';
    avImg.loading = 'lazy';
    avImg.onerror = () => { avImg.src = 'images/user.png'; };
    avatarFrame.appendChild(avImg);

    const userInfoText = document.createElement('div');
    userInfoText.className = 'user-info-text';
    userInfoText.onclick = () => location.href = `profile.html?id=${currentProfileId}`;

    const nameRow = document.createElement('div');
    nameRow.style.cssText = 'display:flex;align-items:center;gap:5px;flex-wrap:wrap;';
    const displayNameSpan = document.createElement('span');
    displayNameSpan.className = 'ans-display-name';
    displayNameSpan.textContent = ownerData.name || t('anonymous');
    nameRow.appendChild(displayNameSpan);

    if (isDev) {
        const adminBadge = document.createElement('img');
        adminBadge.src='images/admin-verified-logo.png'; adminBadge.style.height='14px'; adminBadge.alt='';
        nameRow.appendChild(adminBadge);
        const devLabel = document.createElement('span');
        devLabel.style.cssText='font-size:9px;background:var(--admin-red);padding:1px 5px;border-radius:4px;';
        devLabel.innerHTML='<i class="fa-solid fa-code" aria-hidden="true"></i> المطور';
        nameRow.appendChild(devLabel);
    } else if (isVerified) {
        const verBadge = document.createElement('img');
        verBadge.src='images/verified-logo.png'; verBadge.style.height='14px'; verBadge.alt='';
        nameRow.appendChild(verBadge);
    }

    const userNameSub = document.createElement('span');
    userNameSub.className = 'ans-user-name-sub';
    userNameSub.textContent = username ? `@${username}` : '';
    userInfoText.appendChild(nameRow); userInfoText.appendChild(userNameSub);
    header.appendChild(avatarFrame); header.appendChild(userInfoText);

    const headerActions = document.createElement('div');
    headerActions.style.cssText = 'display:flex;align-items:center;gap:12px;';
    if (isOwner) {
        const delBtn = document.createElement('button');
        delBtn.setAttribute('aria-label','حذف الإجابة');
        delBtn.style.cssText='background:none;border:none;color:#333;font-size:13px;cursor:pointer;transition:color 0.2s;padding:4px;';
        delBtn.innerHTML='<i class="fa-solid fa-trash-can" aria-hidden="true"></i>';
        delBtn.onmouseenter = () => delBtn.style.color='#ff4b4b';
        delBtn.onmouseleave = () => delBtn.style.color='#333';
        delBtn.onclick = () => deleteAnswer(id, data.questionId);
        headerActions.appendChild(delBtn);
    }
    header.appendChild(headerActions);

    const qDiv = document.createElement('div'); qDiv.className = 'ans-q';
    qDiv.textContent = data.questionText || '';

    const aDiv = document.createElement('div'); aDiv.className = 'ans-a';
    aDiv.textContent = data.reply || '';

    const footer  = document.createElement('div'); footer.className  = 'ans-footer';
    const actions = document.createElement('div'); actions.className = 'ans-actions';

    const likeBtn = document.createElement('button');
    likeBtn.className = 'action-btn'+(liked?' liked':'');
    likeBtn.setAttribute('aria-label', 'إعجاب');
    likeBtn.onclick = () => toggleLike(id, likeBtn, data.userId||currentProfileId);
    const likeIcon  = document.createElement('i');
    likeIcon.className = liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
    likeIcon.setAttribute('aria-hidden','true');
    const likeCount = document.createElement('span'); likeCount.textContent = likesCount;
    likeBtn.appendChild(likeIcon); likeBtn.appendChild(likeCount);
    actions.appendChild(likeBtn);

    const replyBtn = document.createElement('button');
    replyBtn.className = 'action-btn';
    replyBtn.setAttribute('aria-label','الردود');
    replyBtn.innerHTML='<i class="fa-regular fa-comment" aria-hidden="true"></i> <span>الردود</span>';
    replyBtn.onclick = () => location.href = `thread.html?id=${id}`;
    actions.appendChild(replyBtn);

    const timeTs = data.answeredAt;
    const timeContainer = document.createElement('div'); timeContainer.className='ans-time-container';
    const timeSpan = document.createElement('span'); timeSpan.className='ans-time'; timeSpan.textContent=formatTime(timeTs);
    const dateSpan = document.createElement('span'); dateSpan.className='ans-date-sub'; dateSpan.textContent=formatDate(timeTs);
    timeContainer.appendChild(timeSpan); timeContainer.appendChild(dateSpan);

    footer.appendChild(actions); footer.appendChild(timeContainer);
    div.appendChild(header); div.appendChild(qDiv); div.appendChild(aDiv); div.appendChild(footer);
    return div;
}

/* ══════════════════════════════════════
   TOGGLE LIKE
══════════════════════════════════════ */
async function toggleLike(id, btn, ownerId) {
    if (!auth.currentUser) return;
    const uid = auth.currentUser.uid;
    const ref = db.collection('answers').doc(id);

    try {
        const snap  = await ref.get();
        const likes = snap.data()?.likes || [];
        const liked = likes.includes(uid);

        if (liked) {
            await ref.update({likes: firebase.firestore.FieldValue.arrayRemove(uid)});
            btn.classList.remove('liked');
            const icon = btn.querySelector('i');
            const cnt  = btn.querySelector('span');
            if (icon) icon.className = 'fa-regular fa-heart';
            if (cnt)  cnt.textContent = Math.max(0, parseInt(cnt.textContent||'0') - 1);
        } else {
            await ref.update({likes: firebase.firestore.FieldValue.arrayUnion(uid)});
            btn.classList.add('liked');
            const icon = btn.querySelector('i');
            const cnt  = btn.querySelector('span');
            if (icon) icon.className = 'fa-solid fa-heart';
            if (cnt)  cnt.textContent = parseInt(cnt.textContent||'0') + 1;

            if (ownerId && ownerId !== uid) {
                try {
                    const meDoc  = await db.collection('users').doc(uid).get();
                    const meData = meDoc.data() || {};
                    await db.collection('notifications').add({
                        receiverId:       ownerId,
                        senderId:         uid,
                        senderName:       meData.name       || t('anonymous'),
                        senderUsername:   meData.username   || '',
                        senderAvatar:     meData.avatarUrl  || '',
                        isSenderVerified: !!(meData.isVerified || meData.isPremium),
                        type:             'like',
                        contentId:        id,
                        isRead:           false,
                        timestamp:        firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch(e) { console.error('like notification:', e); }
            }
        }
    } catch(e) { console.error('toggleLike:', e); }
}

/* ══════════════════════════════════════
   DELETE ANSWER
══════════════════════════════════════ */
async function deleteAnswer(answerId, questionId) {
    if (!auth.currentUser || !isOwner) return;
    const res = await confirmDialog(t('answer_delete_confirm'), t('answer_delete_desc'), t('delete_label'), true);
    if (!res.isConfirmed) return;

    const batch = db.batch();
    batch.delete(db.collection('answers').doc(answerId));
    if (questionId) {
        batch.update(db.collection('questions').doc(questionId), {status:'pending'});
    }
    batch.update(db.collection('users').doc(auth.currentUser.uid), {
        answersCount: firebase.firestore.FieldValue.increment(-1)
    });
    await batch.commit();
}

/* ══════════════════════════════════════
   TOTAL LIKES
══════════════════════════════════════ */
async function calculateTotalLikes(uid) {
    try {
        const snap = await db.collection('answers').where('userId','==',uid).get();
        let total = 0;
        snap.forEach(d => { total += (d.data().likes?.length||0); });
        document.getElementById('count-likes').textContent = total.toLocaleString();
    } catch(e) { console.error('calculateTotalLikes:', e); }
}

/* ══════════════════════════════════════════════════════════════════
   SEND SHOUT — النسخة المُحدَّثة مع fan-out للمتابعين
   - يُرسَل لكل متابع (receiverId) وثيقة مستقلة
   - لو مفيش متابعين يُحفظ كـ receiverId = '__public__'
   - answeredAt: null (لم يُرَد عليه بعد)
   - isAnonymous: false دائماً للشاوت
══════════════════════════════════════════════════════════════════ */
async function sendShout() {
    if (!auth.currentUser || !isOwner) return;

    const now = Date.now();
    if (now - lastShoutSentAt < RATE_LIMIT_MS) return toast('warning', t('rate_limit'));

    const rawText = document.getElementById('shoutInput').value.trim();
    if (!rawText)             return toast('warning', t('shout_empty'));
    if (rawText.length > 500) return toast('warning', t('text_too_long'));

    const cleanedText = ModerationManager.cleanContent(rawText);
    lastShoutSentAt = now;

    try {
        // ① جيب قائمة المتابعين
        const followersSnap = await db
            .collection('users')
            .doc(currentProfileId)
            .collection('followers')
            .get();

        const followerIds = followersSnap.docs.map(d => d.id);

        // ② البيانات المشتركة للشاوت
        const baseShoutData = {
            ownerId:        currentProfileId,
            senderId:       auth.currentUser.uid,
            senderName:     currentUserData?.name       || t('anonymous'),
            senderUsername: currentUserData?.username   || '',
            senderAvatar:   currentUserData?.avatarUrl  || '',
            text:           cleanedText,
            isAnonymous:    false,
            likesCount:     0,
            likedBy:        [],
            repliesCount:   0,
            answeredAt:     null,
            createdAt:      firebase.firestore.FieldValue.serverTimestamp()
        };

        if (followerIds.length === 0) {
            // لو مفيش متابعين: احفظ شاوت بـ receiverId = '__public__'
            await db.collection('shouts').add({
                ...baseShoutData,
                receiverId: '__public__'
            });
        } else {
            // ③ Firestore batch — لكل متابع وثيقة منفصلة (fan-out)
            // Batch محدود بـ 500 عملية — نقسّم على chunks لو المتابعون كتير
            const BATCH_LIMIT = 490;
            for (let i = 0; i < followerIds.length; i += BATCH_LIMIT) {
                const chunk = followerIds.slice(i, i + BATCH_LIMIT);
                const batch = db.batch();
                chunk.forEach(receiverId => {
                    const ref = db.collection('shouts').doc();
                    batch.set(ref, { ...baseShoutData, receiverId });
                });
                await batch.commit();
            }
        }

        document.getElementById('shoutInput').value = '';
        document.getElementById('shoutFilterWarn')?.classList.remove('show');
        toast('success', t('shout_sent'));

        // حدّث تاب الشاوت لو ظاهر
        if (document.getElementById('tab-shouts').classList.contains('active')) {
            loadShouts(currentProfileId);
        }

    } catch(e) {
        console.error('sendShout error:', e);
        lastShoutSentAt = 0;
        toast('error', t('send_error'));
    }
}

/* ══════════════════════════════════════════════════════════════════
   LOAD SHOUTS — يعرض شاوتات صاحب الصفحة بدون تكرار
   (نفس الشاوت المُوزَّع قد يظهر في وثائق متعددة — نُزيل التكرار)
══════════════════════════════════════════════════════════════════ */
async function loadShouts(uid) {
    const tab = document.getElementById('tab-shouts');
    tab.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div>';

    try {
        const snap = await db.collection('shouts')
            .where('ownerId', '==', uid)
            .orderBy('createdAt', 'desc')
            .limit(30)
            .get();

        tab.innerHTML = '';
        if (snap.empty) {
            tab.innerHTML = `<div class="empty-state"><i class="fa-regular fa-comment-dots" aria-hidden="true"></i><p>${escapeHtml(t('no_shouts'))}</p></div>`;
            return;
        }

        // إزالة التكرارات — نفس النص في نفس الثانية = نفس الشاوت المُوزَّع
        const seen   = new Set();
        const unique = [];
        snap.forEach(d => {
            const key = (d.data().text || '') + '_' + (d.data().createdAt?.seconds || '');
            if (!seen.has(key)) {
                seen.add(key);
                unique.push({ id: d.id, data: d.data() });
            }
        });

        const frag = document.createDocumentFragment();
        unique.forEach(item => frag.appendChild(buildShoutCard(item.id, item.data)));
        tab.appendChild(frag);

    } catch(e) { console.error('loadShouts:', e); }
}

async function likeShout(id, btn) {
    if (!auth.currentUser) return;
    const uid = auth.currentUser.uid;
    const ref = db.collection('shouts').doc(id);
    const snap = await ref.get();
    const likesCount = snap.data()?.likesCount || 0;
    const liked = (snap.data()?.likedBy||[]).includes(uid);

    if (liked) {
        const n = Math.max(0, likesCount-1);
        await ref.update({likedBy:firebase.firestore.FieldValue.arrayRemove(uid), likesCount:n});
        btn.classList.remove('liked');
        btn.innerHTML=`<i class="fa-regular fa-heart" aria-hidden="true"></i> ${n}`;
    } else {
        const n = likesCount+1;
        await ref.update({likedBy:firebase.firestore.FieldValue.arrayUnion(uid), likesCount:n});
        btn.classList.add('liked');
        btn.innerHTML=`<i class="fa-solid fa-heart" aria-hidden="true"></i> ${n}`;
    }
}

async function likeSubreply(shoutId, replyId, subId, btn) {
    if (!auth.currentUser) return;
    const uid=auth.currentUser.uid;
    const ref=db.collection('shouts').doc(shoutId).collection('replies').doc(replyId).collection('subreplies').doc(subId);
    const snap=await ref.get();
    const current=snap.data()?.likesCount||0;
    const liked=(snap.data()?.likedBy||[]).includes(uid);

    if (liked) {
        const n=Math.max(0,current-1);
        await ref.update({likedBy:firebase.firestore.FieldValue.arrayRemove(uid),likesCount:n});
        btn.classList.remove('liked'); btn.innerHTML=`<i class="fa-regular fa-heart" aria-hidden="true"></i> ${n}`;
    } else {
        const n=current+1;
        await ref.update({likedBy:firebase.firestore.FieldValue.arrayUnion(uid),likesCount:n});
        btn.classList.add('liked'); btn.innerHTML=`<i class="fa-solid fa-heart" aria-hidden="true"></i> ${n}`;
    }
}

async function deleteSubreply(shoutId, replyId, subId) {
    const res=await confirmDialog(t('delete_subreply'),'',t('delete_label'),true);
    if (!res.isConfirmed) return;
    await db.collection('shouts').doc(shoutId).collection('replies').doc(replyId)
        .collection('subreplies').doc(subId).delete();
}

/* ══════════════════════════════════════
   ACCOUNT ACTIONS
══════════════════════════════════════ */
async function confirmDeactivate() {
    const res=await confirmDialog(t('deactivate_title'),t('deactivate_text'),t('deactivate_confirm'),true);
    if (!res.isConfirmed||!auth.currentUser) return;
    await db.collection('users').doc(auth.currentUser.uid).update({isDeactivated:true});
    auth.signOut().then(()=>location.href='signin.html');
}

async function confirmDeleteAccount() {
    const res=await Swal.fire({
        ...swalBase,icon:'error',iconColor:'#ff4b4b',
        title:t('delete_account_title'),text:t('delete_account_text'),
        showCancelButton:true,
        confirmButtonText:t('delete_account_confirm'),cancelButtonText:t('cancel_btn'),
        customClass:{...swalBase.customClass,confirmButton:'swal-confirm-danger'}
    });
    if (!res.isConfirmed||!auth.currentUser) return;
    await db.collection('users').doc(auth.currentUser.uid).delete();
    await auth.currentUser.delete();
    location.href='signin.html';
}

function showVerificationMessage(type) {
    toast('success', type==='admin' ? t('badge_admin') : t('badge_user'), 2500);
}
