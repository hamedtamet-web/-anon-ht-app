name: Build Signed APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Copy web files to www
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          cp -r fonts www/ 2>/dev/null || true
          cp -r sounds www/ 2>/dev/null || true
      - name: Sync Capacitor
        run: |
          chmod +x node_modules/.bin/cap
          node_modules/.bin/cap sync android
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias anonht \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass anonht123 \
            -keypass anonht123 \
            -dname "CN=AnonHT, OU=Dev, O=AnonHT, L=Cairo, S=Cairo, C=EG"
      - name: Build Signed APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=anonht123 \
            -Pandroid.injected.signing.key.alias=anonht \
            -Pandroid.injected.signing.key.password=anonht123
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
