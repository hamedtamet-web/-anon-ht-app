name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Create www directory
        run: mkdir -p www && cp index.html www/ 2>/dev/null || echo "<html></html>" > www/index.html
      - name: Sync Capacitor
        run: |
          chmod +x node_modules/.bin/cap
          node_modules/.bin/cap sync android
      - name: Fix app name
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Anon HT</string>|g' android/app/src/main/res/values/strings.xml
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
